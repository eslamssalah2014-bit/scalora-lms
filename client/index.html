<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/scalora-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Primary PWA Identity -->
    <title>Scalora | Enterprise Learning Management System</title>
    <meta name="description" content="Scalora LMS - Enterprise Learning Management System & Executive Community" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Theme & Color Configuration -->
    <meta name="theme-color" content="#04152D" />
    <meta name="background-color" content="#04152D" />
    <meta name="msapplication-TileColor" content="#04152D" />
    <meta name="msapplication-navbutton-color" content="#04152D" />
    
    <!-- iOS Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Scalora" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- Android / Chrome Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Scalora" />

    <!-- Early BeforeInstallPrompt Diagnostic Trap -->
    <script>
      window.deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        console.log('⚡ [PWA-DIAGNOSTIC] beforeinstallprompt fired at timestamp:', new Date().toISOString());
        e.preventDefault();
        window.deferredPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
      });
      window.addEventListener('appinstalled', function(e) {
        console.log('🎉 [PWA-DIAGNOSTIC] appinstalled event fired at timestamp:', new Date().toISOString());
        window.deferredPrompt = null;
        window.dispatchEvent(new CustomEvent('pwa-installed'));
      });
    </script>
    
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
      @keyframes pwaGlowPulse {
        0%, 100% { transform: scale(1); opacity: 0.2; }
        50% { transform: scale(1.15); opacity: 0.35; }
      }
      @keyframes pwaDotPulse {
        0%, 100% { opacity: 0.4; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.1); }
      }
    </style>
  </head>
  <body class="bg-[#04152D] text-slate-100 min-h-screen antialiased selection:bg-scalora-blue selection:text-white" style="background-color: #04152D; margin: 0;">
    <div id="root">
      <!-- Native PWA Launch Splash (Instant Render, Zero White Flash) -->
      <div id="pwa-startup-splash" style="position: fixed; inset: 0; background-color: #04152D; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; font-family: 'Plus Jakarta Sans', system-ui, sans-serif;">
        <div style="position: relative; display: flex; align-items: center; justify-content: center;">
          <!-- Ambient luxury cyan blur glow -->
          <div style="position: absolute; width: 160px; height: 160px; background: rgba(0, 210, 255, 0.25); border-radius: 50%; filter: blur(40px); pointer-events: none; animation: pwaGlowPulse 2.4s infinite ease-in-out;"></div>
          <!-- Centered authentic transparent Scalora emblem -->
          <img src="/pwa-192x192.png" alt="Scalora" style="width: 92px; height: 92px; object-fit: contain; position: relative; z-index: 1;" />
        </div>
        <div style="margin-top: 26px; display: flex; align-items: center; gap: 8px;">
          <div style="width: 7px; height: 7px; border-radius: 50%; background: #00D2FF; animation: pwaDotPulse 1.4s infinite ease-in-out; box-shadow: 0 0 10px #00D2FF;"></div>
          <span style="font-size: 13px; font-weight: 800; letter-spacing: 0.18em; color: #FFFFFF; text-transform: uppercase;">Scalora</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
