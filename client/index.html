<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/scalora-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Primary PWA Identity -->
    <title>Scalora | Enterprise Learning Management System</title>
    <meta name="description" content="Scalora LMS - Enterprise Learning Management System & Executive Community" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Theme & Color Configuration -->
    <meta name="theme-color" content="#04152D" />
    <meta name="background-color" content="#04152D" />
    <meta name="msapplication-TileColor" content="#04152D" />
    <meta name="msapplication-navbutton-color" content="#04152D" />
    
    <!-- iOS Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Scalora" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- Android / Chrome Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Scalora" />

    <!-- Early BeforeInstallPrompt Diagnostic Trap -->
    <script>
      window.deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        console.log('⚡ [PWA-DIAGNOSTIC] beforeinstallprompt fired at timestamp:', new Date().toISOString());
        e.preventDefault();
        window.deferredPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
      });
      window.addEventListener('appinstalled', function(e) {
        console.log('🎉 [PWA-DIAGNOSTIC] appinstalled event fired at timestamp:', new Date().toISOString());
        window.deferredPrompt = null;
        window.dispatchEvent(new CustomEvent('pwa-installed'));
      });
    </script>
    
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
      #scalora-splash {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        background-color: #04152D;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 999999;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        user-select: none;
        -webkit-user-select: none;
        animation: splashSequence 1.3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }

      .splash-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        animation: splashLogoScale 1.3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }

      .splash-logo {
        width: 108px;
        height: 108px;
        object-fit: contain;
        background: transparent !important;
        border: none !important;
        outline: none !important;
        box-shadow: none !important;
        display: block;
      }

      .splash-text {
        margin-top: 18px;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.16em;
        color: #FFFFFF;
        text-transform: uppercase;
        opacity: 0.95;
      }

      @keyframes splashSequence {
        0% {
          opacity: 0;
          visibility: visible;
        }
        23% { /* 300ms Fade In */
          opacity: 1;
          visibility: visible;
        }
        84% { /* 800ms Hold */
          opacity: 1;
          visibility: visible;
        }
        100% { /* 200ms Fade Out */
          opacity: 0;
          visibility: hidden;
          pointer-events: none;
        }
      }

      @keyframes splashLogoScale {
        0% {
          transform: scale(0.95);
        }
        23% {
          transform: scale(1);
        }
        84% {
          transform: scale(1);
        }
        100% {
          transform: scale(1.02);
        }
      }
    </style>
  </head>
  <body class="bg-[#04152D] text-slate-100 min-h-screen antialiased selection:bg-scalora-blue selection:text-white" style="background-color: #04152D; margin: 0;">
    <!-- Scalora Native Splash Screen (True Transparency, Exact SaaS Palette) -->
    <div id="scalora-splash">
      <div class="splash-content">
        <img src="/scalora-icon-transparent.png" alt="Scalora" class="splash-logo" />
        <div class="splash-text">Scalora</div>
      </div>
    </div>
    <script>
      setTimeout(function() {
        var splash = document.getElementById('scalora-splash');
        if (splash) splash.remove();
      }, 1400);
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
