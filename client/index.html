<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/scalora-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Primary PWA Identity -->
    <title>Scalora | Enterprise Learning Management System</title>
    <meta name="description" content="Scalora LMS - Enterprise Learning Management System & Executive Community" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Theme & Color Configuration -->
    <meta name="theme-color" content="#04152D" />
    <meta name="msapplication-TileColor" content="#04152D" />
    <meta name="msapplication-navbutton-color" content="#04152D" />
    
    <!-- iOS Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Scalora" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- Android / Chrome Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Scalora" />

    <!-- Early BeforeInstallPrompt Diagnostic Trap -->
    <script>
      window.deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        console.log('⚡ [PWA-DIAGNOSTIC] beforeinstallprompt fired at timestamp:', new Date().toISOString());
        e.preventDefault();
        window.deferredPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
      });
      window.addEventListener('appinstalled', function(e) {
        console.log('🎉 [PWA-DIAGNOSTIC] appinstalled event fired at timestamp:', new Date().toISOString());
        window.deferredPrompt = null;
        window.dispatchEvent(new CustomEvent('pwa-installed'));
      });
    </script>
    
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#04152D] text-slate-100 min-h-screen antialiased selection:bg-scalora-blue selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
