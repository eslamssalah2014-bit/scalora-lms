<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline | Scalora LMS</title>
    <link rel="icon" type="image/png" href="/scalora-logo.png" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      body {
        background-color: #04152D;
        color: #f1f5f9;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        text-align: center;
      }
      .card {
        background: #0B1528;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        padding: 40px 32px;
        max-width: 440px;
        width: 100%;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      }
      .icon-box {
        width: 64px;
        height: 64px;
        border-radius: 20px;
        background: rgba(6, 182, 212, 0.15);
        border: 1px solid rgba(6, 182, 212, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 24px;
      }
      .icon-box svg {
        width: 32px;
        height: 32px;
        stroke: #38bdf8;
      }
      h1 {
        font-size: 22px;
        font-weight: 800;
        margin-bottom: 12px;
        color: #ffffff;
      }
      p {
        font-size: 14px;
        color: #94a3b8;
        line-height: 1.6;
        margin-bottom: 28px;
      }
      button {
        background: linear-gradient(135deg, #06b6d4, #0284c7);
        color: #ffffff;
        border: none;
        border-radius: 16px;
        padding: 14px 28px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.2s, opacity 0.2s;
        width: 100%;
      }
      button:hover {
        opacity: 0.95;
        transform: translateY(-1px);
      }
      button:active {
        transform: translateY(0);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon-box">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      </div>
      <h1>You are offline</h1>
      <p>
        Please check your internet connection and reconnect to continue accessing your Scalora courses and community.
      </p>
      <button onclick="window.location.reload()">Try Again</button>
    </div>
  </body>
</html>
